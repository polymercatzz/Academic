<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางสอน | Academic Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { canvas: '#F7F9FC', brand: '#2563eb', ink: '#0f172a', muted: '#64748b' },
          fontFamily: { body: ['"Noto Sans Thai"', 'system-ui', 'sans-serif'] },
          boxShadow: { soft: '0 12px 32px rgba(15, 23, 42, 0.06)', modal: '0 24px 80px rgba(15, 23, 42, 0.18)' }
        }
      }
    };
  </script>
  <style>
    .modal-backdrop { background: rgba(15, 23, 42, .46); backdrop-filter: blur(5px); }
    .modal-panel { animation: modalIn .18s ease-out; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .drawer-panel { animation: drawerIn .2s ease-out; }
    @keyframes drawerIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .pool-drop.is-over { border-color: #2563eb; background: #eff6ff; }
    .drop-zone.is-ready { border-color: #2563eb; background: #eff6ff; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .step-dot.is-active { background: #2563eb; color: #fff; }
    .step-dot.is-done { background: #10b981; color: #fff; }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-canvas font-body text-ink">
  <div id="layoutSidebar"></div>
  <div class="lg:pl-80">
    <div id="layoutHeader"></div>
    <script src="timetable-core.js"></script>
    <script src="timetable-data.js"></script>
    <script>TT.load();</script>
    <script src="../shared/academic-layout.js?v=9"></script>
    <script>AcademicLayout.mount({ active: 'timetable', eyebrow: 'ตารางเรียน', title: 'ตารางสอน' });</script>

    <main class="px-4 py-6 lg:px-8 lg:py-8">
      <div id="roleGuard" class="mx-auto hidden max-w-xl"></div>
      <div id="page" class="mx-auto max-w-[1600px] space-y-6">
        <section class="flex flex-col gap-5 xl:flex-row xl:items-end xl:justify-between">
          <div>
            <nav class="mb-3 flex flex-wrap items-center gap-2 text-sm text-slate-500" aria-label="breadcrumb">
              <a href="../reports/overview.html" class="font-medium text-slate-600 transition hover:text-brand">ภาพรวมงานวิชาการ</a><span class="text-slate-300">&gt;</span>
              <span class="font-medium text-slate-800">ตารางเรียน</span><span class="text-slate-300">&gt;</span>
              <span class="font-medium text-slate-800">ตารางสอน</span>
            </nav>
            <div class="flex flex-wrap items-center gap-3">
              <h1 class="text-3xl font-semibold tracking-tight text-slate-950 lg:text-4xl">ตารางสอน</h1>
              <span id="termBadge" class="rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700"></span>
            </div>
            <p class="mt-3 max-w-3xl text-sm leading-6 text-slate-500">สร้างตารางสอนของทุกครูในแต่ละภาคเรียน (คัดลอกจากฉบับที่มี หรือสร้างใหม่ทั้งหมด) จัดเอง จัดอัตโนมัติตามเงื่อนไข หรือจัดอัตโนมัติมาตรฐาน แล้วเผยแพร่ให้ครูเห็น ฉบับเผยแพร่แก้ไขไม่ได้ ต้องคัดลอกเป็นฉบับร่างก่อน</p>
          </div>
          <div class="flex flex-wrap items-end gap-3">
            <label class="block"><span class="mb-2 block text-sm font-semibold text-slate-700">ภาคเรียน</span>
              <select id="termSelect" class="w-56 rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></select></label>
            <button id="openWizardButton" type="button" class="inline-flex items-center gap-2 rounded-2xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-100">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6v-2Z"/></svg>สร้างตารางสอนใหม่
            </button>
          </div>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-soft lg:p-6">
          <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.18em] text-blue-600">ฉบับของตารางสอน</p>
              <h2 id="versionsTitle" class="mt-2 text-xl font-semibold text-slate-950"></h2>
            </div>
            <p id="deadlineInfo" class="text-sm text-slate-500"></p>
          </div>
          <div id="versionList" class="mt-4 grid gap-3 md:grid-cols-2 2xl:grid-cols-4"></div>
        </section>

        <div id="workspace" class="space-y-6"></div>
      </div>
    </main>
  </div>

  <div id="drawer" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div data-close-drawer class="absolute inset-0 bg-slate-900/30"></div>
    <div class="drawer-panel absolute inset-y-0 right-0 flex w-full max-w-[480px] flex-col bg-white shadow-modal">
      <div class="flex items-start justify-between border-b border-slate-100 px-5 py-5">
        <div><p id="drawerEyebrow" class="text-xs font-semibold uppercase tracking-[0.18em] text-blue-600"></p><h2 id="drawerTitle" class="mt-1 text-xl font-semibold text-slate-950"></h2><p id="drawerSubtitle" class="mt-1 text-sm text-slate-500"></p></div>
        <button data-close-drawer type="button" class="rounded-xl p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700" aria-label="ปิด"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"/></svg></button>
      </div>
      <div id="drawerBody" class="min-h-0 flex-1 space-y-5 overflow-y-auto px-5 py-5 tt-scroll"></div>
      <div id="drawerFooter" class="flex items-center justify-between gap-3 border-t border-slate-100 px-5 py-4"></div>
    </div>
  </div>

  <div id="modal" class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div id="modalPanel" class="modal-panel flex max-h-[94vh] w-full max-w-4xl flex-col overflow-hidden rounded-3xl bg-white shadow-modal">
      <div class="flex items-start justify-between border-b border-slate-100 px-5 py-5 lg:px-7">
        <div><p id="modalEyebrow" class="text-xs font-semibold uppercase tracking-[0.18em] text-blue-600"></p><h2 id="modalTitle" class="mt-1 text-xl font-semibold text-slate-950"></h2><p id="modalSubtitle" class="mt-1 text-sm text-slate-500"></p></div>
        <button data-close-modal type="button" class="rounded-xl p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700" aria-label="ปิด"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"/></svg></button>
      </div>
      <div id="modalSteps" class="hidden border-b border-slate-100 px-5 py-3 lg:px-7"></div>
      <div id="modalBody" class="min-h-0 flex-1 overflow-y-auto px-5 py-6 lg:px-7 tt-scroll"></div>
      <div id="modalFooter" class="flex flex-col-reverse gap-3 border-t border-slate-100 px-5 py-4 sm:flex-row sm:items-center sm:justify-end lg:px-7"></div>
    </div>
  </div>

  <script>
    /* ==================================================================
     * timetable.html — admin: versions, creation wizard, scheduling editor
     * Terms: see GLOSSARY.md. Engine & store: timetable-core.js (window.TT).
     * ================================================================== */
    const $ = (id) => document.getElementById(id);
    const { esc, icon } = TT;
    const sel = 'w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100';
    const selSm = 'rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100';
    const btn2 = 'inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40';
    const btnP = 'inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-40';
    const btnG = 'rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100';
    const db = () => TT.db;

    const state = {
      term: '2570-1', versionId: null, tab: 'teacher', group: '', search: '', teacherId: 't05', level: 1, classId: '1-1', roomId: 'LAB1', highlight: '',
      readinessOpen: false, undo: {}, drag: null, drawer: null, modal: null, simulatedFixes: new Set()
    };
    const ver = () => TT.version(state.versionId);
    const editable = () => ver()?.status === 'draft' && TT.role() === 'admin';
    const allTerms = () => Object.keys(db().terms).sort();

    /* ------------------------------------------------------------------ selection */
    function pickDefaultVersion(term) {
      const list = TT.versionsOf(term);
      const draft = list.filter((v) => v.status === 'draft').sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1))[0];
      return (draft || TT.publishedOf(term) || list[0] || null)?.id || null;
    }
    function applyHash() {
      const m = location.hash.match(/version=([^&]+)/);
      const v = m && TT.version(decodeURIComponent(m[1]));
      if (v) { state.term = v.term; state.versionId = v.id; }
    }

    /* ------------------------------------------------------------------ mutations + undo */
    function commit(action, detail, fn) {
      const v = ver();
      state.undo[v.id] = state.undo[v.id] || [];
      state.undo[v.id].push({ snap: JSON.stringify(v.entries), action });
      if (state.undo[v.id].length > 40) state.undo[v.id].shift();
      fn(v);
      TT.logHistory(v.term, v.id, action, detail);
      TT.save();
    }
    function undo() {
      const v = ver(); const stack = state.undo[v?.id] || [];
      const last = stack.pop();
      if (!last) return;
      v.entries = JSON.parse(last.snap);
      TT.logHistory(v.term, v.id, 'ย้อนกลับ', `ยกเลิกการ "${last.action}"`);
      TT.save();
      TT.toast('ย้อนกลับแล้ว', `ยกเลิกการ "${last.action}"`);
    }

    /* ------------------------------------------------------------------ render: heading + versions */
    function render() {
      AcademicLayout.refresh();
      if (TT.role() !== 'admin') {
        $('page').classList.add('hidden'); $('roleGuard').classList.remove('hidden');
        $('roleGuard').innerHTML = `<div class="rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-soft"><p class="text-xs font-semibold uppercase tracking-[0.18em] text-blue-600">สำหรับงานวิชาการ</p><h1 class="mt-2 text-2xl font-semibold text-slate-950">หน้านี้สำหรับ admin เท่านั้น</h1><p class="mt-2 text-sm text-slate-500">ครูดูตารางที่เผยแพร่แล้วได้ที่หน้า "ตารางสอนของฉัน"</p><div class="mt-5 flex justify-center gap-3"><a href="my-timetable.html" class="${btn2}">ไปที่ตารางสอนของฉัน</a><button id="becomeAdmin" type="button" class="${btnP}">สลับเป็น admin</button></div></div>`;
        $('becomeAdmin').onclick = () => { TT.setRole('admin'); location.reload(); };
        return;
      }
      $('page').classList.remove('hidden'); $('roleGuard').classList.add('hidden');
      if (!state.versionId || !TT.version(state.versionId) || TT.version(state.versionId).term !== state.term) state.versionId = pickDefaultVersion(state.term);
      $('termSelect').innerHTML = allTerms().map((t) => `<option value="${t}" ${t === state.term ? 'selected' : ''}>${TT.termLabel(t)}</option>`).join('');
      $('termBadge').textContent = TT.termLabel(state.term);
      renderVersions();
      renderWorkspace();
      if (state.drawer) renderDrawer();
    }
    function renderVersions() {
      const order = { published: 0, draft: 1, old: 2 };
      const list = TT.versionsOf(state.term).sort((a, b) => order[a.status] - order[b.status] || (a.createdAt < b.createdAt ? 1 : -1));
      const info = TT.termInfo(state.term);
      $('versionsTitle').textContent = `${TT.termLabel(state.term)} · ${list.length} ฉบับ`;
      const open = TT.unavailabilityOpen(state.term);
      $('deadlineInfo').innerHTML = info ? `เปิดภาคเรียน ${TT.formatDate(info.start)} · วันปิดรับเวลาไม่ว่าง <span class="font-semibold ${open ? 'text-blue-700' : 'text-slate-700'}">${TT.formatDate(info.unavailDeadline)}</span> ${open ? `(เหลือ ${TT.daysLeft(info.unavailDeadline)} วัน)` : '(ปิดรับแล้ว)'}` : '';
      if (!list.length) {
        $('versionList').innerHTML = `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-6 text-center md:col-span-2 2xl:col-span-4"><p class="font-semibold text-slate-800">${TT.termLabel(state.term)} ยังไม่มีตารางสอน</p><p class="mt-1 text-sm text-slate-500">สร้างตารางสอนใหม่ โดยคัดลอกจากฉบับที่มีหรือสร้างใหม่ทั้งหมด</p><button data-act="wizard" type="button" class="${btnP} mt-4">สร้างตารางสอน</button></div>`;
        return;
      }
      $('versionList').innerHTML = list.map((v) => {
        const st = TT.VERSION_STATUS[v.status];
        const iss = TT.computeIssues(v);
        const prog = TT.versionProgress(v);
        const active = v.id === state.versionId;
        const base = v.basedOn && TT.version(v.basedOn);
        const div = v.status === 'draft' ? TT.divergence(v).length : 0;
        return `<article class="flex flex-col rounded-2xl border p-4 transition ${active ? 'border-blue-500 bg-blue-50/50 ring-1 ring-blue-500' : 'border-slate-200 bg-white hover:border-blue-200'}">
          <div class="flex items-start justify-between gap-2"><button data-open-version="${v.id}" type="button" class="min-w-0 text-left"><p class="truncate font-semibold text-slate-900">${esc(v.name)}</p><p class="mt-0.5 text-xs text-slate-500">${base ? `คัดลอกจาก "${esc(base.name)}"` : 'สร้างใหม่ทั้งหมด'}</p></button><span class="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-semibold ${st.cls}">${st.label}</span></div>
          <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full ${iss.errorCells ? 'bg-rose-500' : prog.pct === 100 ? 'bg-emerald-500' : 'bg-blue-600'}" style="width:${prog.pct}%"></div></div>
          <div class="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-xs text-slate-500"><span>จัดแล้ว ${prog.pct}%</span><span class="${iss.errorCells ? 'font-semibold text-rose-600' : ''}">Conflict ${iss.errorCells}</span><span>คำเตือน ${iss.warnCells}</span>${div ? `<span class="font-semibold text-violet-700">ล้าหลังฉบับเผยแพร่ ${div}</span>` : ''}</div>
          <p class="mt-2 text-[11px] text-slate-400">${v.status === 'draft' ? `สร้าง ${TT.formatDateTime(v.createdAt)} · ${esc(v.createdBy)}` : `เผยแพร่ ${TT.formatDateTime(v.publishedAt)}`}</p>
          <div class="mt-3 flex flex-wrap gap-2 border-t border-slate-100 pt-3">
            ${active ? '<span class="rounded-lg bg-blue-600 px-2.5 py-1 text-xs font-semibold text-white">กำลังเปิด</span>' : `<button data-open-version="${v.id}" type="button" class="rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-700 hover:bg-slate-50">เปิด</button>`}
            <button data-copy-version="${v.id}" type="button" class="rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-700 hover:bg-slate-50">คัดลอกเป็นฉบับร่าง</button>
            ${v.status === 'draft' ? `<button data-rename-version="${v.id}" type="button" class="rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-700 hover:bg-slate-50">เปลี่ยนชื่อ</button><button data-delete-version="${v.id}" type="button" class="rounded-lg border border-rose-200 px-2.5 py-1 text-xs font-semibold text-rose-600 hover:bg-rose-50">ลบ</button>` : ''}
          </div>
        </article>`;
      }).join('');
    }

    /* ------------------------------------------------------------------ render: workspace */
    function renderWorkspace() {
      const v = ver();
      if (!v) { $('workspace').innerHTML = ''; return; }
      const st = TT.VERSION_STATUS[v.status];
      const iss = TT.computeIssues(v);
      const prog = TT.versionProgress(v);
      const div = v.status === 'draft' ? TT.divergence(v) : [];
      const ready = v.status === 'draft' ? TT.readiness(v) : null;
      const overload = iss.teacherWarnings.length;
      const canUndo = (state.undo[v.id] || []).length;
      const cards = [
        { label: 'ความคืบหน้า', value: `${prog.pct}%`, hint: `จัดแล้ว ${prog.placed}/${prog.required} คาบ`, color: 'bg-blue-50 text-blue-600', ic: 'check', bar: prog.pct },
        { label: 'รายการรอจัด', value: prog.required - prog.placed, hint: 'คาบที่ยังไม่ได้วางลงตาราง', color: 'bg-indigo-50 text-indigo-600', ic: 'grip' },
        { label: 'Conflict', value: iss.errorCells, hint: 'ต้องเป็น 0 ก่อนเผยแพร่', color: iss.errorCells ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600', ic: 'warn' },
        { label: 'คำเตือน', value: iss.warnCells, hint: 'ขัดเงื่อนไขที่กำหนดเพิ่ม', color: iss.warnCells ? 'bg-amber-50 text-amber-600' : 'bg-emerald-50 text-emerald-600', ic: 'info' },
        { label: 'ครูภาระเกิน', value: overload, hint: 'คาบต่อสัปดาห์เกินกำหนด', color: overload ? 'bg-violet-50 text-violet-600' : 'bg-slate-100 text-slate-600', ic: 'user' }
      ];
      $('workspace').innerHTML = `
        <section class="rounded-3xl border border-slate-200 bg-white shadow-soft">
          <div class="flex flex-col gap-4 p-5 lg:flex-row lg:items-center lg:justify-between lg:p-6">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2"><h2 class="text-xl font-semibold text-slate-950">${esc(v.name)}</h2><span class="rounded-full px-2.5 py-1 text-xs font-semibold ${st.cls}">${st.label}</span></div>
              <p class="mt-1 text-sm text-slate-500">${v.timeStructures.map((ts) => `${esc(ts.name)}: ${ts.start}–${TT.fmt(TT.dayEnd(ts))} · ${ts.periods} คาบ × ${ts.periodMin} นาที`).join(' · ')}</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              ${editable() ? `
                <button data-act="undo" type="button" class="${btn2}" ${canUndo ? '' : 'disabled'}>${icon('swap')}ย้อนกลับ</button>
                <button data-act="settings" type="button" class="${btn2}">${icon('clock')}โครงสร้างเวลา / กิจกรรม</button>
                <button data-act="conditions" type="button" class="${btn2}">${icon('info')}เงื่อนไขการจัด</button>
                <button data-act="import" type="button" class="${btn2}">${icon('upload')}นำเข้า Excel</button>
                <button data-act="export" type="button" class="${btn2}">${icon('download')}ส่งออก</button>
                <button data-act="auto" type="button" class="${btnP} !rounded-xl !py-2">✦ จัดอัตโนมัติ</button>
                <button data-act="publish" type="button" class="inline-flex items-center gap-2 rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">${icon('send')}เผยแพร่</button>`
              : `<button data-act="export" type="button" class="${btn2}">${icon('download')}ส่งออก</button><button data-copy-version="${v.id}" type="button" class="${btnP} !py-2">${icon('copy')}คัดลอกเป็นฉบับร่างเพื่อแก้ไข</button>`}
            </div>
          </div>
          ${v.status !== 'draft' ? `<div class="mx-5 mb-5 flex gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600 lg:mx-6">${icon('lock', 'h-5 w-5 shrink-0 text-slate-400')}<span>${v.status === 'published' ? 'ฉบับเผยแพร่แก้ไขไม่ได้ ครูกำลังใช้ฉบับนี้ หากต้องการเปลี่ยนให้คัดลอกเป็นฉบับร่าง แล้วเผยแพร่ใหม่ หรืออนุมัติคำร้องของครูที่หน้าคำขออนุมัติ' : 'ฉบับเก่าถูกแทนที่แล้ว ใช้ดูย้อนหลังเท่านั้น'}</span></div>` : ''}
          ${div.length ? `<div class="mx-5 mb-5 flex flex-col gap-3 rounded-2xl border border-violet-200 bg-violet-50 p-4 lg:mx-6 lg:flex-row lg:items-center lg:justify-between"><div class="flex gap-3">${icon('info', 'h-5 w-5 shrink-0 text-violet-600')}<div><p class="text-sm font-semibold text-violet-900">ฉบับเผยแพร่มีการเปลี่ยนแปลง ${div.length} รายการหลังคัดลอกฉบับร่างนี้</p><p class="mt-1 text-xs text-violet-800/80">${div.map((r) => `${esc(TT.teacherName(r.teacherId))}: ${TT.REQUEST_TYPES[r.type]} ${TT.className(r.classId)} ${TT.slotLabel(r.slot)}`).join(' · ')}</p></div></div><button data-act="merge" type="button" class="shrink-0 rounded-xl bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-700">นำมารวม</button></div>` : ''}

        ${ready ? readinessCard(ready) : ''}
        <section class="rounded-3xl border border-slate-200 bg-white shadow-soft">
          <div class="flex gap-2 overflow-x-auto border-b border-slate-100 px-5 py-4 tt-scroll lg:px-6" role="tablist">
            ${[['teacher', editable() ? '✎ จัดตารางสอนครู' : 'ตารางสอนรายครู'], ['class', 'ตารางเรียนรายห้อง'], ['room', 'ตารางการใช้ห้อง'], ['level', 'ตารางรวมระดับชั้น'], ['report', 'รายงาน']].map(([k, l]) => `<button data-tab="${k}" type="button" class="whitespace-nowrap rounded-2xl px-4 py-2.5 text-sm font-semibold transition ${state.tab === k ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}">${l}</button>`).join('')}

    }

    function readinessCard(r) {
      return `<section class="rounded-3xl border border-slate-200 bg-white shadow-soft">
        <button data-act="toggle-readiness" type="button" class="flex w-full items-center justify-between gap-3 px-5 py-4 text-left lg:px-6">

          <span class="flex items-center gap-2">${r.fails ? `<span class="rounded-full bg-rose-50 px-2.5 py-1 text-xs font-semibold text-rose-700">ไม่ผ่าน ${r.fails}</span>` : ''}${r.warns ? `<span class="rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-700">คำเตือน ${r.warns}</span>` : ''}<svg class="h-5 w-5 text-slate-400 transition ${state.readinessOpen ? 'rotate-180' : ''}" viewBox="0 0 24 24" fill="currentColor"><path d="m7.41 8.59 4.59 4.58 4.59-4.58L18 10l-6 6-6-6 1.41-1.41Z"/></svg></span>

    function readinessList(r) {
      const style = { pass: ['bg-emerald-50 text-emerald-600', 'check'], fail: ['bg-rose-50 text-rose-600', 'x'], warn: ['bg-amber-50 text-amber-600', 'warn'], info: ['bg-blue-50 text-blue-600', 'info'] };
      return `<div class="mb-4 flex flex-wrap items-center justify-between gap-3"><p class="text-sm text-slate-500">แก้ข้อมูลที่ต้นทางแล้วกด "ตรวจใหม่" · ข้อมูลของทีมอื่นแก้ในระบบนี้ไม่ได้ ให้คัดลอกรายการไปส่งต่อ</p><button data-act="recheck" type="button" class="${btn2}">${icon('swap')}ตรวจใหม่</button></div>
        <div class="grid gap-3 lg:grid-cols-2">${r.items.map((i) => `<div class="rounded-2xl border border-slate-200 p-4">
          <div class="flex gap-3"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl ${style[i.status][0]}">${icon(style[i.status][1])}</span><div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-2"><p class="text-sm font-semibold text-slate-800">${esc(i.title)}</p><span class="rounded-full px-2 py-0.5 text-[10px] font-semibold ${SOURCE_LABEL[i.source][1]}">${SOURCE_LABEL[i.source][0]}</span></div><p class="mt-1 text-xs leading-5 text-slate-500">${esc(i.detail)}</p></div></div>
          ${i.rows.length ? `<details class="mt-3"><summary class="cursor-pointer text-xs font-semibold text-blue-700">ดู ${i.rows.length} รายการ</summary><div class="mt-2 max-h-56 space-y-1.5 overflow-y-auto pr-1 tt-scroll">${i.rows.map((row) => `<div class="flex items-center justify-between gap-2 rounded-xl bg-slate-50 px-3 py-2 text-xs"><span class="min-w-0 text-slate-700">${esc(row.text)}</span>${row.link ? `<a href="${row.link}" target="_blank" rel="noopener" data-fix-link="${esc(row.text)}" class="inline-flex shrink-0 items-center gap-1 rounded-lg bg-white px-2 py-1 font-semibold text-blue-700 shadow-sm hover:bg-blue-50">ไปแก้ไข ${icon('external', 'h-3 w-3')}</a>` : row.external ? '<span class="shrink-0 text-[10px] font-semibold text-slate-400">ต้องแก้ที่ระบบต้นทาง</span>' : ''}</div>`).join('')}</div>${i.source === 'external' ? `<button data-copy-rows="${i.id}" type="button" class="mt-2 inline-flex items-center gap-1 text-xs font-semibold text-slate-600 hover:text-slate-900">${icon('copy', 'h-3.5 w-3.5')}คัดลอกรายการไปส่งต่อ</button>` : ''}</details>` : ''}
        </div>`).join('')}</div>`;
    }

    /* ------------------------------------------------------------------ teacher tab (editor) */
    const visibleTeachers = () => db().external.teachers.filter((t) => (!state.group || t.group === state.group) && (!state.search || t.name.includes(state.search) || t.id.includes(state.search)) && (TT.loadOfTeacher(ver().term, t.id).length || TT.teacherBlocks(ver(), t.id).length));
    function teacherErrorCount(v, tid, iss) { return new Set(iss.list.filter((i) => i.sev === 'error' && (i.teachers || []).includes(tid)).map((i) => `${i.cid}|${i.slot}`)).size; }
    function renderTeacherTab() {
      const v = ver();
      const iss = TT.computeIssues(v);
      const list = visibleTeachers();
      if (list.length && !list.some((t) => t.id === state.teacherId)) state.teacherId = list[0].id;
      const tid = state.teacherId;
      const t = TT.teacher(tid);
      const prog = TT.teacherProgress(v, tid);
      const blocks = TT.teacherBlocks(v, tid);
      const cond = TT.teacherCond(v, tid);
      const days = TT.versionDays(v);
      const perDay = days.map((d) => blocks.filter((b) => b.day === d).length);
      $('tabBody').innerHTML = `
        <div class="border-b border-slate-100 px-5 py-4 lg:px-6">
          <div class="flex flex-col gap-3 lg:flex-row lg:items-center">
            <select id="groupFilter" class="${selSm}"><option value="">ทุกกลุ่มสาระ</option>${Object.entries(TT.GROUPS).filter(([k]) => k !== 'ก').map(([k, g]) => `<option value="${k}" ${state.group === k ? 'selected' : ''}>${g.name}</option>`).join('')}</select>
            <div id="teacherCombo" class="relative w-full lg:w-80">
              <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4a6 6 0 1 0 3.8 10.6l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg></span>
              <input id="teacherSearch" type="text" autocomplete="off" value="${esc(state.search)}" placeholder="พิมพ์ชื่อครู หรือเลือกจากรายการ" role="combobox" aria-expanded="false" aria-controls="teacherComboList" aria-autocomplete="list" class="${selSm} w-full pl-9 pr-16">
              ${state.search ? '<button id="teacherSearchClear" type="button" class="absolute inset-y-0 right-9 flex items-center px-1 text-slate-400 hover:text-slate-700" aria-label="ล้างคำค้นหา">✕</button>' : ''}
              <button id="teacherComboToggle" type="button" class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-700" aria-label="เปิดรายการครู"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="m7.41 8.59 4.59 4.58 4.59-4.58L18 10l-6 6-6-6 1.41-1.41Z"/></svg></button>
              <div id="teacherComboList" role="listbox" class="absolute left-0 right-0 top-full z-30 mt-1 hidden max-h-96 overflow-y-auto rounded-2xl border border-slate-200 bg-white py-1 shadow-xl tt-scroll"></div>
            </div>
            <span id="teacherCount" class="text-xs text-slate-400">${list.length} คน · ครูที่ได้รับการมอบหมายสอนในภาคเรียนนี้</span>
          </div>
          <div class="mt-3 flex gap-2 overflow-x-auto pb-1 tt-scroll">${list.map((x) => {
            const p = TT.teacherProgress(v, x.id); const errs = teacherErrorCount(v, x.id, iss); const active = x.id === tid;
            const status = !p.required ? '<span class="text-slate-400">ไม่มีการมอบหมาย</span>' : p.placed === 0 ? '<span class="text-slate-400">ยังไม่เริ่มจัด</span>' : errs ? `<span class="text-rose-600">${errs} Conflict</span>` : p.pct === 100 ? '<span class="text-emerald-600">จัดครบแล้ว</span>' : `<span class="text-amber-600">รอจัด ${p.required - p.placed} คาบ</span>`;
            return `<button data-teacher="${x.id}" type="button" class="min-w-[170px] shrink-0 rounded-2xl border px-4 py-3 text-left transition ${active ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-slate-200 bg-white hover:border-blue-200 hover:bg-slate-50'}">
              <span class="flex items-center justify-between gap-2"><span class="truncate font-semibold ${active ? 'text-blue-700' : 'text-slate-900'}">${esc(x.name)}</span><span class="text-xs font-semibold text-slate-500">${p.pct}%</span></span>
              <span class="mt-0.5 flex items-center gap-1.5 truncate text-[11px] text-slate-400"><span class="h-2 w-2 shrink-0 rounded-full ${TT.GROUPS[x.group].dot}"></span>${TT.GROUPS[x.group].name}</span>
              <span class="mt-2 block h-1.5 overflow-hidden rounded-full bg-slate-100"><span class="block h-full rounded-full ${errs ? 'bg-rose-500' : p.pct === 100 ? 'bg-emerald-500' : 'bg-blue-500'}" style="width:${p.pct}%"></span></span>
              <span class="mt-1.5 block text-xs font-medium">${status}</span></button>`;
          }).join('') || '<p class="py-4 text-sm text-slate-400">ไม่พบครูตามตัวกรอง</p>'}</div>
        </div>
        ${t ? `<div class="flex flex-col gap-3 border-b border-slate-100 px-5 py-4 lg:flex-row lg:items-center lg:justify-between lg:px-6">
          <div class="flex flex-wrap items-center gap-x-5 gap-y-2"><h3 class="text-lg font-semibold text-slate-950">ตารางสอน ${esc(t.name)}</h3><span class="text-sm text-slate-500">${TT.GROUPS[t.group].name}</span><span class="text-sm text-slate-500">คาบสอน <span class="font-semibold text-slate-800">${blocks.length}/${cond.maxPerWeek}</span> ต่อสัปดาห์</span><span class="text-sm text-slate-500">ต่อวัน ${days.map((d, i) => `<span class="${perDay[i] > cond.maxPerDay ? 'font-semibold text-rose-600' : ''}">${TT.DAYS[d].short}${perDay[i]}</span>`).join(' ')} (กำหนด ${cond.maxPerDay})</span></div>
          ${editable() ? `<div class="flex flex-wrap gap-2"><button data-act="import-teacher" type="button" class="${btn2}">${icon('upload')}นำเข้า Excel ของครูคนนี้</button><button data-act="auto-teacher" type="button" class="${btn2}">✦ จัดอัตโนมัติเฉพาะครูคนนี้</button><div class="relative" id="clearMenuWrap"><button data-act="clear-menu" type="button" aria-haspopup="menu" aria-expanded="false" class="${btn2} !border-rose-200 !text-rose-600">ล้างข้อมูล<svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="m7.41 8.59 4.59 4.58 4.59-4.58L18 10l-6 6-6-6 1.41-1.41Z"/></svg></button>
            <div id="clearMenu" role="menu" class="absolute right-0 top-full z-30 mt-1 hidden w-72 overflow-hidden rounded-2xl border border-slate-200 bg-white py-1 shadow-xl">
              <button data-act="clear-teacher" role="menuitem" type="button" class="block w-full px-4 py-2.5 text-left hover:bg-rose-50"><span class="block text-sm font-semibold text-slate-800">ล้างตารางครู</span><span class="block text-xs text-slate-500">เฉพาะคาบของ${esc(TT.teacherShort(tid))} (ไม่รวมคาบที่ล็อก)</span></button>
              <button data-act="clear-all" role="menuitem" type="button" class="block w-full px-4 py-2.5 text-left hover:bg-rose-50"><span class="block text-sm font-semibold text-rose-700">ล้างตารางทั้งฉบับ</span><span class="block text-xs text-slate-500">ทุกครู ทุกห้องในฉบับร่างนี้ (ไม่รวมคาบที่ล็อก)</span></button>
            </div></div></div>` : ''}
        </div>
        <div class="grid min-[1760px]:grid-cols-[minmax(0,1fr)_300px]">
          <div class="min-w-0 p-4 lg:p-5">
            <div class="overflow-x-auto tt-scroll">${TT.timeline({ id: 'teacherTimeline', days, range: TT.versionRange(v), bands: TT.teacherBands(v, tid), blocks: blocks.map((b) => ({ ...b, attrs: `data-entry="${b.cid}|${b.slot}"`, html: TT.entryCard({ code: b.entry.code, title: `${TT.className(b.cid)} · ${b.entry.code}`, line1: `${TT.roomShort(b.entry.room)} · ${TT.fmt(b.start)}`, line2: b.entry.teachers.length > 1 ? `ร่วมสอน: ${b.entry.teachers.filter((x) => x !== tid).map(TT.teacherShort).join(', ')}` : '', issues: iss.byCell.get(`${b.cid}|${b.slot}`) || [], locked: b.entry.locked, draggable: editable() && !b.entry.locked, dragAttrs: 'data-drag="entry"', extraClass: 'cursor-pointer' }) })), emptyClickAttr: editable() ? 'data-row-add="1"' : '' })}</div>
            <p class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-400"><span>แกนเวลาจริง: ม.ต้น และ ม.ปลาย มีเวลาคาบต่างกัน ระบบตรวจซ้อนจากเวลาที่ทับกัน</span>${editable() ? '<span>ลากจากรายการรอจัดมาวางบนช่องคาบของห้องนั้น · ลากคาบกลับไปที่รายการเพื่อนำออก · คลิกที่ว่างเพื่อเพิ่มคาบ</span>' : '<span>ฉบับนี้ดูได้อย่างเดียว</span>'}</p>
          </div>
          <aside class="grid gap-5 border-t border-slate-100 p-4 lg:grid-cols-[minmax(0,1fr)_320px] lg:p-5 min-[1760px]:block min-[1760px]:border-l min-[1760px]:border-t-0">
            ${poolHtml(v, tid, prog)}
            <div class="h-fit rounded-2xl border border-slate-200 p-4 min-[1760px]:mt-5"><p class="text-sm font-semibold text-slate-800">สัญลักษณ์</p><div class="mt-3 grid grid-cols-2 gap-x-3 gap-y-2 text-xs text-slate-600">${legendHtml()}</div></div>
          </aside>
        </div>` : ''}`;
    }
    function poolHtml(v, tid, prog) {
      const done = prog.required > 0 && !prog.remaining.length;
      return `<div><div class="flex items-center justify-between gap-3"><div><p class="font-semibold text-slate-900">รายการรอจัด</p><p class="text-xs text-slate-500">จากการมอบหมายสอน · จัดแล้ว ${prog.placed}/${prog.required} คาบ</p></div><span class="rounded-full ${done ? 'bg-emerald-50 text-emerald-700' : 'bg-blue-50 text-blue-700'} px-2.5 py-1 text-xs font-semibold">${done ? 'ครบแล้ว' : `${prog.required - prog.placed} คาบ`}</span></div>
        <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full ${done ? 'bg-emerald-500' : 'bg-blue-600'}" style="width:${prog.pct}%"></div></div>
        <div id="poolDrop" class="pool-drop mt-4 grid gap-2 rounded-2xl border-2 border-dashed border-transparent transition sm:grid-cols-2 xl:grid-cols-3 min-[1760px]:grid-cols-1">
          ${!prog.required ? '<div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">ครูคนนี้ยังไม่ได้รับมอบหมายสอนในภาคเรียนนี้</div>' : done ? '<div class="rounded-2xl border border-emerald-100 bg-emerald-50 p-4 text-sm text-emerald-800"><p class="font-semibold">จัดครบทุกรายวิชาแล้ว</p><p class="mt-1 text-xs text-emerald-700/80">ลากคาบมาวางที่นี่เพื่อนำออก</p></div>' : prog.remaining.map((s) => {
            const g = TT.GROUPS[s.subject.group];
            const rt = TT.subjectCond(v, s.code).roomType;
            return `<div ${editable() ? `draggable="true" data-drag="pool" data-cid="${s.classId}" data-code="${s.code}"` : ''} class="flex items-center gap-3 rounded-2xl border ${g.card} p-3 transition ${editable() ? 'cursor-grab hover:shadow-md' : ''}">
              <span class="text-slate-400">${icon('grip')}</span>
              <div class="min-w-0 flex-1"><p class="text-xs font-bold ${g.text}">${TT.className(s.classId)} · ${s.code}</p><p class="truncate text-sm font-semibold text-slate-800">${esc(s.subject.name)}</p><p class="truncate text-xs text-slate-500">${TT.tsOfClass(v, s.classId).name}${rt ? ` · ${TT.ROOM_TYPES[rt]}` : ''}${s.teachers.length > 1 ? ' · ร่วมสอน' : ''}</p></div>
              <span class="shrink-0 rounded-full bg-white px-2 py-0.5 text-xs font-bold text-slate-700 shadow-sm">×${s.remain}</span></div>`;
          }).join('')}
        </div></div>`;
    }
    function legendHtml() {
      return Object.values(TT.GROUPS).map((g) => `<span class="flex items-center gap-2"><span class="h-2.5 w-2.5 shrink-0 rounded-full ${g.dot}"></span><span class="truncate">${g.name}</span></span>`).join('') +
        `<span class="flex items-center gap-2"><span class="h-3 w-3 shrink-0 rounded ring-2 ring-rose-400"></span>Conflict</span><span class="flex items-center gap-2"><span class="h-3 w-3 shrink-0 rounded ring-2 ring-amber-300"></span>คำเตือน</span><span class="flex items-center gap-2 text-slate-500">${icon('lock', 'h-3 w-3')}คาบที่ล็อก</span><span class="flex items-center gap-2"><span class="tt-hatch h-3 w-3 shrink-0 rounded border border-slate-300"></span>กิจกรรม / เวลาไม่ว่าง</span>`;
    }

    /* ------------------------------------------------------------------ drag & drop on the clock timeline */
    function freeRoomFor(v, cid, slot, code) {
      const rt = TT.subjectCond(v, code).roomType;
      if (!rt) return TT.cls(cid).homeroom;
      const rooms = db().external.rooms.filter((r) => r.type === rt);
      const ok = rooms.find((r) => !TT.checkPlacement(v, cid, slot, { code, teachers: [], room: r.id }).some((i) => i.type === 'room-clash'));
      return (ok || rooms[0]).id;
    }
    function dragCand(slot) {
      const v = ver(); const d = state.drag;
      if (d.type === 'entry') return v.entries[d.cid][d.slot];
      const l = TT.loadOfClass(v.term, d.cid).find((x) => x.code === d.code);
      return { code: l.code, teachers: [...l.teachers], room: freeRoomFor(v, d.cid, slot, l.code) };
    }
    function evalZone(slot) {
      const v = ver(); const d = state.drag; const cid = d.cid;
      if (d.type === 'entry' && d.slot === slot) return { level: 'self' };
      const act = TT.classActivityAt(v, cid, slot);
      if (act) return { level: 'blocked', reason: `${TT.className(cid)} มีกิจกรรมล็อกเวลา "${act.name}"` };
      const occ = v.entries[cid][slot];
      if (occ) {
        if (occ.locked) return { level: 'blocked', reason: `${TT.className(cid)} มีคาบที่ล็อกไว้` };
        if (d.type === 'pool' || !occ.teachers.includes(state.teacherId)) return { level: 'blocked', reason: `${TT.className(cid)} เรียน ${occ.code} กับ${TT.teachersLabel(occ.teachers)} อยู่แล้ว` };
      }
      const ignore = [`${cid}|${slot}`]; if (d.type === 'entry') ignore.push(`${cid}|${d.slot}`);
      const iss = TT.checkPlacement(v, cid, slot, dragCand(slot), { ignore });
      return { level: TT.worstSev(iss) === 'error' ? 'bad' : iss.length ? 'warn' : 'ok', reason: iss.map((i) => i.msg).join('\n') || 'วางได้ ไม่พบ Conflict', swap: !!occ };
    }
    function showZones() {
      const v = ver(); const cid = state.drag.cid;
      const [lo, hi] = TT.versionRange(v);
      const pct = (m) => (m - lo) / (hi - lo) * 100;
      TT.classSlots(v, cid).forEach((slot) => {
        const r = evalZone(slot);
        if (r.level === 'self') return;
        const iv = TT.slotInterval(v, cid, slot);
        const row = document.querySelector(`#teacherTimeline .tt-tl-row[data-day="${iv.day}"]`);
        if (!row) return;
        const z = document.createElement('div');
        z.className = `tt-zone absolute inset-y-1 z-20 rounded-xl tt-drop-${r.level}`;
        z.style.left = `${pct(iv.start)}%`; z.style.width = `${pct(iv.end) - pct(iv.start)}%`;
        z.dataset.zone = slot; z.dataset.level = r.level; z.title = r.reason;
        z.innerHTML = `<span class="pointer-events-none absolute left-1 right-1 top-1 truncate text-center text-[10px] font-bold text-slate-700">${TT.className(cid)} คาบ ${slot.split('-')[1]}${r.swap ? ' · สลับ' : ''}</span>`;
        row.appendChild(z);
      });
    }
    function clearZones() { document.querySelectorAll('.tt-zone').forEach((z) => z.remove()); document.querySelectorAll('.is-dragging').forEach((el) => el.classList.remove('is-dragging')); $('poolDrop')?.classList.remove('is-over'); }
    function bindDrag() {
      const root = $('workspace');
      root.addEventListener('dragstart', (ev) => {
        const el = ev.target.closest('[data-drag]');
        if (!el || !editable()) return;
        if (el.dataset.drag === 'pool') state.drag = { type: 'pool', cid: el.dataset.cid, code: el.dataset.code };
        else { const [cid, slot] = el.closest('[data-entry]').dataset.entry.split('|'); state.drag = { type: 'entry', cid, slot }; }
        ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', 'tt');
        requestAnimationFrame(() => { el.classList.add('is-dragging'); showZones(); });
      });
      root.addEventListener('dragend', () => { state.drag = null; clearZones(); });
      root.addEventListener('dragover', (ev) => {
        if (!state.drag) return;
        const z = ev.target.closest('.tt-zone');
        document.querySelectorAll('.tt-zone.tt-drop-hover').forEach((x) => { if (x !== z) x.classList.remove('tt-drop-hover'); });
        if (z && z.dataset.level !== 'blocked') { ev.preventDefault(); z.classList.add('tt-drop-hover'); }
        const pool = ev.target.closest('#poolDrop');
        if (pool && state.drag.type === 'entry') { ev.preventDefault(); pool.classList.add('is-over'); } else $('poolDrop')?.classList.remove('is-over');
      });
      root.addEventListener('drop', (ev) => {
        if (!state.drag) return;
        ev.preventDefault();
        const d = state.drag;
        const v = ver();
        if (ev.target.closest('#poolDrop') && d.type === 'entry') {
          state.drag = null; clearZones();
          const e = v.entries[d.cid][d.slot];
          commit('นำคาบออก', `${TT.teachersLabel(e.teachers)} · ${TT.className(d.cid)} ${e.code} · ${TT.slotLabel(d.slot)}`, (vv) => { delete vv.entries[d.cid][d.slot]; });
          TT.toast('นำคาบออกแล้ว', `${TT.className(d.cid)} ${e.code} กลับไปอยู่ในรายการรอจัด`);
          return;
        }
        const z = ev.target.closest('.tt-zone');
        if (!z) { state.drag = null; clearZones(); return; }
        const slot = z.dataset.zone;
        const r = evalZone(slot); const cand = dragCand(slot);
        state.drag = null; clearZones();
        if (r.level === 'blocked') { TT.toast('วางไม่ได้', r.reason, 'error'); return; }
        if (d.type === 'pool') commit('เพิ่มคาบ', `${TT.teachersLabel(cand.teachers)} · ${TT.className(d.cid)} ${cand.code} → ${TT.slotLabel(slot)}`, (vv) => { vv.entries[d.cid][slot] = { ...cand, src: 'manual' }; });
        else commit(v.entries[d.cid][slot] ? 'สลับคาบ' : 'ย้ายคาบ', `${TT.teachersLabel(cand.teachers)} · ${TT.className(d.cid)} ${cand.code} ${TT.slotLabel(d.slot)} → ${TT.slotLabel(slot)}`, (vv) => {
          const a = vv.entries[d.cid][d.slot]; const b = vv.entries[d.cid][slot];
          vv.entries[d.cid][slot] = { ...a, src: 'manual' };
          if (b) vv.entries[d.cid][d.slot] = { ...b, src: 'manual' }; else delete vv.entries[d.cid][d.slot];
        });
        const iss = TT.computeIssues(ver()).byCell.get(`${d.cid}|${slot}`) || [];
        if (TT.worstSev(iss) === 'error') TT.toast('วางแล้ว แต่เป็น Conflict', iss[0].msg, 'error');
        else if (iss.length) TT.toast('วางแล้ว มีคำเตือน', iss[0].msg, 'warn');
        else TT.toast('บันทึกแล้ว', `${TT.className(d.cid)} · ${TT.slotLabel(slot)} ${TT.slotTimeLabel(v, d.cid, slot)}`);
      });
    }

    /* ------------------------------------------------------------------ drawer (detail / edit / add) */
    function openEntry(cid, slot, readOnly = !editable()) {
      const v = ver(); const e = v.entries[cid]?.[slot];
      if (!e) return;
      const [d, p] = TT.parseSlot(slot);
      state.drawer = { mode: readOnly ? 'view' : 'edit', cid, slot, d, p, form: TT.clone(e) };
      $('drawer').classList.remove('hidden'); document.body.classList.add('overflow-hidden');
      renderDrawer();
    }
    function openAdd(day, minute) {
      const v = ver(); const tid = state.teacherId;
      const prog = TT.teacherProgress(v, tid);
      const options = prog.remaining.length ? prog.remaining : TT.loadOfTeacher(v.term, tid);
      if (!options.length) { TT.toast('ครูคนนี้ยังไม่มีการมอบหมายสอน', 'แก้ที่หน้าจัดการหลักสูตร', 'info'); return; }
      const pick = options[0];
      const ts = TT.tsOfClass(v, pick.classId);
      const pts = TT.periodTimes(ts);
      const near = pts.reduce((best, pt) => (Math.abs(pt.start - minute) < Math.abs(best.start - minute) ? pt : best), pts[0]);
      const d = ts.days.includes(day) ? day : ts.days[0];
      state.drawer = { mode: 'add', cid: pick.classId, slot: `${d}-${near.no}`, d, p: near.no, form: { code: pick.code, teachers: [...pick.teachers], room: freeRoomFor(v, pick.classId, `${d}-${near.no}`, pick.code), locked: false } };
      $('drawer').classList.remove('hidden'); document.body.classList.add('overflow-hidden');
      renderDrawer();
    }
    function closeDrawer() { $('drawer').classList.add('hidden'); document.body.classList.remove('overflow-hidden'); state.drawer = null; }
    function drawerBlock(st) {
      const v = ver(); const target = `${st.d}-${st.p}`;
      const act = TT.classActivityAt(v, st.cid, target);
      if (act) return `${TT.className(st.cid)} มีกิจกรรมล็อกเวลา "${act.name}"`;
      const occ = v.entries[st.cid][target];
      if (!occ || (st.mode === 'edit' && target === st.slot)) return null;
      if (occ.locked) return `${TT.className(st.cid)} มีคาบที่ล็อกไว้ในเวลานี้`;
      if (st.mode === 'add' || !occ.teachers.some((t) => st.form.teachers.includes(t))) return `${TT.className(st.cid)} เรียน ${occ.code} กับ${TT.teachersLabel(occ.teachers)} อยู่แล้ว`;
      return null;
    }
    function issueListHtml(iss) {

      if (st.mode === 'view') {

        if ($('drawerGoTeacher')) $('drawerGoTeacher').onclick = () => { state.tab = 'teacher'; state.teacherId = e.teachers[0]; state.group = ''; state.search = ''; closeDrawer(); render(); openEntry(cid, st.slot, false); };

        <div class="space-y-4">

          <label class="block"><span class="mb-2 flex items-center justify-between text-sm font-semibold text-slate-700">ครูผู้สอน ${form.teachers.join() !== assigned.join() ? '<span class="rounded-full bg-violet-50 px-2 py-0.5 text-[11px] text-violet-700">ไม่ตรงการมอบหมายสอน</span>' : ''}</span>
            <select data-f="teacher0" class="${sel}">${db().external.teachers.filter((t) => t.group === TT.subject(form.code)?.group || form.teachers.includes(t.id)).map((t) => `<option value="${t.id}" ${t.id === form.teachers[0] ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>

          <div class="grid grid-cols-2 gap-3">

            <label class="block"><span class="mb-2 block text-sm font-semibold text-slate-700">คาบ (${esc(ts.name)})</span><select data-f="p" class="${sel}">${pts.map((p) => `<option value="${p.no}" ${p.no === st.p ? 'selected' : ''}>คาบ ${p.no} · ${TT.fmt(p.start)}–${TT.fmt(p.end)}</option>`).join('')}</select></label>

          <label class="flex items-center justify-between gap-3 rounded-2xl border border-slate-200 p-4"><span><span class="block text-sm font-semibold text-slate-800">ล็อกคาบนี้</span><span class="block text-xs text-slate-500">การจัดอัตโนมัติจะไม่ย้ายหรือลบคาบนี้</span></span><input data-f="locked" type="checkbox" ${form.locked ? 'checked' : ''} class="h-5 w-5 rounded text-blue-600"></label>

        <div><p class="text-sm font-semibold text-slate-800">ช่องเวลาที่แนะนำ (ไม่เกิด Conflict)</p><div class="mt-2 flex flex-wrap gap-2">${suggestions.length ? suggestions.map((x) => `<button data-suggest="${x.slot}" type="button" class="rounded-xl border ${x.issues.length ? 'border-amber-200 bg-amber-50 text-amber-700' : 'border-emerald-200 bg-emerald-50 text-emerald-700'} px-3 py-1.5 text-xs font-semibold hover:brightness-95">${TT.DAYS[TT.parseSlot(x.slot)[0]].short} คาบ ${TT.parseSlot(x.slot)[1]} · ${TT.slotTimeLabel(v, cid, x.slot)}</button>`).join('') : '<span class="text-xs text-slate-500">ไม่มีช่องว่างที่ไม่เกิด Conflict</span>'}</div></div>`;

      $('drawerBody').querySelectorAll('[data-f]').forEach((el) => el.addEventListener('change', () => {

      $('drawerSave').onclick = () => {

          if (moved) { const other = vv.entries[s2.cid][tgt]; if (other) vv.entries[s2.cid][s2.slot] = { ...other, src: 'manual' }; else delete vv.entries[s2.cid][s2.slot]; }

      state.modal = { kind: 'wizard', step: 0, term, method: 'copy', sourceId: src ? src.id : (TT.publishedOf(state.term) || baseVersion())?.id, name: '', timeStructures: null, activities: null, deadline: db().terms[term]?.unavailDeadline || '' };

        <div class="max-h-[280px] overflow-auto rounded-2xl border border-slate-200 tt-scroll"><table class="w-full text-sm"><thead class="sticky top-0 bg-slate-50 text-xs font-semibold text-slate-500"><tr><th class="px-4 py-2.5 text-left">ครู</th><th class="px-4 py-2.5 text-left">ก่อน</th><th class="px-4 py-2.5 text-left">หลัง</th><th class="px-4 py-2.5 text-left"></th></tr></thead><tbody class="divide-y divide-slate-100">${rows.map((x) => `<tr><td class="px-4 py-2 font-semibold text-slate-800">${esc(TT.teacherName(x.tid))}</td><td class="px-4 py-2 text-slate-500">${x.before.placed}/${x.before.required}</td><td class="px-4 py-2 font-semibold">${x.after.placed}/${x.after.required}</td><td class="px-4 py-2"><div class="h-2 w-32 overflow-hidden rounded-full bg-slate-100"><div class="h-full ${x.after.pct === 100 ? 'bg-emerald-500' : 'bg-blue-600'}" style="width:${x.after.pct}%"></div></div></td></tr>`).join('')}</tbody></table></div>

    function readImportFile(file) {
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      if (!['xlsx', 'xls', 'csv'].includes(ext)) { TT.toast('รองรับเฉพาะ Excel (.xlsx, .csv)', 'ไม่รองรับการนำเข้า PDF', 'error'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const wb = XLSX.read(reader.result, { type: 'array' });
          const sheet = wb.Sheets[wb.SheetNames.find((n) => n.includes('นำเข้า')) || wb.SheetNames[0]];
          const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
          const h = aoa.findIndex((r) => r.map(String).some((x) => x.trim() === 'ห้อง') && r.map(String).some((x) => x.trim() === 'วัน'));
          if (h < 0) { TT.toast('รูปแบบไฟล์ไม่ตรงไฟล์ต้นแบบ', 'ไม่พบหัวคอลัมน์ "ห้อง" และ "วัน"', 'error'); return; }
          const header = aoa[h].map((x) => String(x).trim());
          const col = (names) => header.findIndex((x) => names.includes(x));
          const map = [col(['ห้อง']), col(['วัน']), col(['คาบ']), col(['รหัสวิชา']), col(['รหัสครู', 'ครู']), col(['ห้องเรียน', 'สถานที่'])];
          const rows = aoa.slice(h + 1).filter((r) => r.some((x) => String(x).trim())).map((r) => map.map((i) => (i >= 0 ? r[i] : '')));
          state.modal.rows = rows; state.modal.fileName = file.name; renderImport();
        } catch (err) { TT.toast('อ่านไฟล์ไม่สำเร็จ', String(err.message || err), 'error'); }
      };
      reader.readAsArrayBuffer(file);
    }
    function sampleImportRows() {

    async function publishVersion() {
      const v = ver(); const iss = TT.computeIssues(v); const prog = TT.versionProgress(v);
      if (iss.errorCells) {
        const go = await TT.confirm({ title: 'ยังเผยแพร่ไม่ได้', message: `มี Conflict ${iss.errorCells} คาบ ต้องแก้ให้เป็น 0 ก่อนเผยแพร่`, okText: 'ดูรายงาน Conflict', tone: 'primary' });
        if (go) { state.tab = 'report'; render(); }
        return;
      }
      const prev = TT.publishedOf(v.term);
      const pending = prog.required - prog.placed;
      const ok = await TT.confirm({ title: `เผยแพร่ "${v.name}"?`, message: `ครูจะเห็นตารางนี้ทันทีและฉบับนี้จะแก้ไขไม่ได้อีก${prev ? `<br>"${esc(prev.name)}" จะกลายเป็นฉบับเก่า` : ''}${pending ? `<br><span class="font-semibold text-amber-700">ยังมีรายการรอจัด ${pending} คาบ</span>` : ''}${iss.warnCells ? `<br><span class="text-amber-700">คำเตือน ${iss.warnCells} คาบ</span>` : ''}`, okText: 'เผยแพร่', tone: 'success', requireText: 'เผยแพร่' });
      if (!ok) return;
      TT.publish(v);
      TT.save();
      TT.toast('เผยแพร่แล้ว', `${v.name} · แจ้งครูแล้ว`);
    }

    function simulateFixes() {
      const term = state.modal?.kind === 'wizard' ? state.modal.term : ver()?.term;

      (db().assignments[term] || []).forEach((a) => {
        if (a.teachers.length) return;
        const hit = [...state.simulatedFixes].some((k) => k.startsWith(`${TT.className(a.classId)} · ${a.code}`));
        if (!hit) return;
        const q = db().external.teachers.filter((t) => t.canTeach.includes(a.code)).sort((x, y) => TT.loadOfTeacher(term, x.id).length - TT.loadOfTeacher(term, y.id).length)[0];
        if (q) { a.teachers = [q.id]; fixed++; }
      });
      state.simulatedFixes.clear();
      if (fixed) { TT.logHistory(term, null, 'ตรวจใหม่', `การมอบหมายสอนจากหน้าจัดการหลักสูตรอัปเดต ${fixed} รายการ`); TT.save(); }

        if ((el = q('[data-goto-entry]'))) { const [cid, slot] = el.dataset.gotoEntry.split('|'); const e2 = ver().entries[cid][slot]; state.tab = 'teacher'; state.teacherId = e2?.teachers[0] || state.teacherId; state.group = ''; state.search = ''; render(); openEntry(cid, slot); return; }
        if ((el = q('[data-view]'))) { const [cid, slot] = el.dataset.view.split('|'); openEntry(cid, slot, true); return; }
        if ((el = q('[data-copy-rows]'))) { const r = TT.readiness(state.modal?.kind === 'wizard' ? wizTempVersion() : ver()).items.find((i) => i.id === el.dataset.copyRows); navigator.clipboard?.writeText(r.rows.map((x) => x.text).join('\n')).catch(() => {}); TT.toast('คัดลอกรายการแล้ว', `${r.rows.length} รายการ · ส่งต่อให้ทีมที่รับผิดชอบ`, 'info'); return; }
        if ((el = q('#teacherTimeline [data-entry]'))) { const [cid, slot] = el.dataset.entry.split('|'); openEntry(cid, slot); return; }
        if ((el = q('[data-row-add]')) && editable() && !q('.tt-zone')) {
          const [lo, hi] = TT.versionRange(ver()); const rect = el.getBoundingClientRect();
          openAdd(Number(el.dataset.day), Math.round(lo + (e.clientX - rect.left) / rect.width * (hi - lo))); return;
        }
        if ((el = q('[data-act]'))) {
          const a = el.dataset.act;
          if (a === 'wizard') openWizard();
          else if (a === 'undo') undo();
          else if (a === 'settings') openSettings();
          else if (a === 'conditions') { e.preventDefault(); openConditions(); }
          else if (a === 'import') openImport();
          else if (a === 'import-teacher') openImport(state.teacherId);
          else if (a === 'export') openExport();
          else if (a === 'auto') openAuto('all');
          else if (a === 'auto-teacher') openAuto('teacher');
          else if (a === 'publish') publishVersion();
          else if (a === 'clear-menu') { const m = $('clearMenu'); m.classList.toggle('hidden'); el.setAttribute('aria-expanded', String(!m.classList.contains('hidden'))); }
          else if (a === 'clear-teacher') { $('clearMenu')?.classList.add('hidden'); clearTeacher(); }
          else if (a === 'clear-all') { $('clearMenu')?.classList.add('hidden'); clearAll(); }
          else if (a === 'toggle-readiness') { state.readinessOpen = !state.readinessOpen; render(); }
          else if (a === 'recheck') { const n = simulateFixes(); if (state.modal?.kind === 'wizard') wizStep5(); else render(); TT.toast('ตรวจใหม่แล้ว', n ? `การมอบหมายสอนที่แก้แล้วจากหน้าจัดการหลักสูตร ${n} รายการ` : 'ข้อมูลเป็นปัจจุบัน', 'info'); }
          else if (a === 'merge') { const v = ver(); state.undo[v.id] = state.undo[v.id] || []; state.undo[v.id].push({ snap: JSON.stringify(v.entries), action: 'นำการเปลี่ยนแปลงมารวม' }); const r = TT.mergeDivergence(v); TT.save(); TT.toast('นำการเปลี่ยนแปลงมารวมแล้ว', `รวม ${r.merged.length} รายการ${r.skipped.length ? ` · ข้าม ${r.skipped.length} (ช่องในฉบับร่างไม่ตรงกัน)` : ''}`); }
        }
      });
      document.addEventListener('change', (e) => {
        if (e.target.id === 'groupFilter') { state.group = e.target.value; render(); }
        if (e.target.id === 'levelSelect') { state.level = Number(e.target.value); render(); }
        if (e.target.id === 'roomSelect') { state.roomId = e.target.value; render(); }
        if (e.target.id === 'highlightSelect') { state.highlight = e.target.value; render(); }
      });
      // ช่องค้นหาครู: พิมพ์เพื่อกรอง หรือเปิดรายการแล้วเลือก (combobox)
      let comboActive = -1;
      const comboMatches = () => {
        const v = ver(); const q = state.search;
        return db().external.teachers.filter((t) => (!state.group || t.group === state.group) && (TT.loadOfTeacher(v.term, t.id).length || TT.teacherBlocks(v, t.id).length) && (!q || t.name.includes(q) || t.id.includes(q) || TT.GROUPS[t.group].name.includes(q)))
          .sort((a, b) => groupOrder.indexOf(a.group) - groupOrder.indexOf(b.group) || a.name.localeCompare(b.name, 'th'));
      };
      const groupOrder = Object.keys(TT.GROUPS);
      const comboOpen = () => !$('teacherComboList')?.classList.contains('hidden');
      function renderCombo(open = true) {
        const box = $('teacherComboList'); const input = $('teacherSearch');
        if (!box) return;
        const v = ver(); const list = comboMatches();
        comboActive = Math.min(comboActive, list.length - 1);
        let lastGroup = null;
        box.innerHTML = list.length ? list.map((t, i) => {
          const p = TT.teacherProgress(v, t.id);
          const head = t.group !== lastGroup ? `<p class="px-3 pb-1 pt-2 text-[11px] font-semibold uppercase tracking-wide text-slate-400">${TT.GROUPS[t.group].name}</p>` : '';
          lastGroup = t.group;
          return `${head}<button type="button" role="option" data-combo-pick="${t.id}" aria-selected="${t.id === state.teacherId}" class="flex w-full items-center gap-3 px-3 py-2 text-left text-sm transition ${i === comboActive ? 'bg-blue-50' : 'hover:bg-slate-50'} ${t.id === state.teacherId ? 'font-semibold text-blue-700' : 'text-slate-700'}"><span class="h-2 w-2 shrink-0 rounded-full ${TT.GROUPS[t.group].dot}"></span><span class="min-w-0 flex-1 truncate">${esc(t.name)}</span><span class="shrink-0 text-xs ${p.pct === 100 ? 'text-emerald-600' : 'text-slate-400'}">${p.pct}%</span>${t.id === state.teacherId ? icon('check', 'h-4 w-4 shrink-0 text-blue-600') : ''}</button>`;
        }).join('') : '<p class="px-3 py-4 text-center text-sm text-slate-400">ไม่พบครูที่ตรงกับคำค้นหา</p>';
        box.classList.toggle('hidden', !open);
        input.setAttribute('aria-expanded', String(open));
        // filter chips without a full re-render so the input keeps focus
        const ids = new Set(list.map((t) => t.id));
        document.querySelectorAll('#tabBody [data-teacher]').forEach((chip) => chip.classList.toggle('hidden', !ids.has(chip.dataset.teacher)));
        if ($('teacherCount')) $('teacherCount').textContent = `${list.length} คน${state.search ? ` · ค้นหา "${state.search}"` : ' · ครูที่ได้รับการมอบหมายสอนในภาคเรียนนี้'}`;
        box.querySelector('.bg-blue-50')?.scrollIntoView({ block: 'nearest' });
      }
      function pickTeacher(id) {
        state.teacherId = id; state.search = ''; comboActive = -1;
        render();
        document.querySelector(`#tabBody [data-teacher="${id}"]`)?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      }
      document.addEventListener('input', (e) => { if (e.target.id === 'teacherSearch') { state.search = e.target.value.trim(); comboActive = state.search ? 0 : -1; renderCombo(true); } });
      document.addEventListener('focusin', (e) => { if (e.target.id === 'teacherSearch') renderCombo(true); });
      document.addEventListener('keydown', (e) => {
        if (e.target.id !== 'teacherSearch') return;
        const list = comboMatches();
        if (e.key === 'ArrowDown') { e.preventDefault(); comboActive = Math.min(list.length - 1, comboActive + 1); renderCombo(true); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); comboActive = Math.max(0, comboActive - 1); renderCombo(true); }
        else if (e.key === 'Enter') { e.preventDefault(); const t = list[Math.max(0, comboActive)]; if (t) pickTeacher(t.id); }
        else if (e.key === 'Escape') { e.stopImmediatePropagation(); renderCombo(false); }
      });
      document.addEventListener('mousedown', (e) => {
        const pick = e.target.closest('[data-combo-pick]');
        if (pick) { e.preventDefault(); pickTeacher(pick.dataset.comboPick); return; }
        if (e.target.closest('#teacherComboToggle')) { e.preventDefault(); if (comboOpen()) renderCombo(false); else { $('teacherSearch').focus(); renderCombo(true); } return; }
        if (e.target.closest('#teacherSearchClear')) { e.preventDefault(); state.search = ''; render(); $('teacherSearch')?.focus(); return; }
        if (!e.target.closest('#teacherCombo') && comboOpen()) renderCombo(false);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { if (state.drawer) closeDrawer(); else if (state.modal) closeModal(); }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.target.closest('input,select,textarea') && editable()) { e.preventDefault(); undo(); }
      });
      window.addEventListener('hashchange', () => { applyHash(); render(); });
      bindDrag();
      TT.onChange(render);
    }

    applyHash();
    bind();
    render();
  </script>
</body>
</html>
