    function escapeHTML(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function buildBackLink() {
      const backParams = new URLSearchParams({ view: 'student' });
      ['year', 'term', 'gradeLevel', 'classRoom', 'subject', 'assessmentPeriod', 'status'].forEach((key) => {
        const value = params.get(key);
        if (value) {
          backParams.set(key, value);
        }
      });
      const qs = backParams.toString();
      els.backLink.href = qs ? `student-retake-management.html?${qs}` : 'student-retake-management.html?view=student';
    }

    function getStudentOverallStatus(student) {
      if (student.completedCount === student.subjectCount && student.subjectCount > 0) {
        return 'ดำเนินการครบแล้ว';
      }
      if (student.followUpCount > 0) {
        return 'ต้องติดตาม';
      }
      return 'รอสอบซ่อม';
    }

    function getStudentPriority(student) {
      if (student.completedCount === student.subjectCount && student.subjectCount > 0) {
        return { label: 'ดำเนินการครบแล้ว', tone: 'green' };
      }
      if (student.subjectCount >= 3 || student.waitingCount >= 2 || (student.zeroCount > 0 && student.pendingGradeCount > 0)) {
        return { label: 'เร่งด่วนสูง', tone: 'red' };
      }
      if (student.subjectCount >= 2 || student.followUpCount > 0) {
        return { label: 'ต้องติดตาม', tone: 'amber' };
      }
      return { label: 'ปกติ', tone: 'green' };
    }

    function groupRecordsByStudent(rows) {
      const map = new Map();
      rows.forEach((row) => {
        if (!map.has(row.studentId)) {
          map.set(row.studentId, {
            studentId: row.studentId,
            name: row.name,
            gradeLevel: row.gradeLevel,
            classRoom: row.classRoom,
            subjects: [],
            subjectCount: 0,
            waitingCount: 0,
            completedCount: 0,
            followUpCount: 0,
            zeroCount: 0,
            pendingGradeCount: 0
          });
        }

        const student = map.get(row.studentId);
        student.subjects.push(row);
        student.subjectCount = student.subjects.length;
        student.waitingCount += row.status === 'รอสอบซ่อม' ? 1 : 0;
        student.completedCount += row.status === 'สอบซ่อมแล้ว' ? 1 : 0;
        student.followUpCount += row.status === 'ติดตามงาน' ? 1 : 0;
        student.zeroCount += row.score === '0' ? 1 : 0;
        student.pendingGradeCount += row.score === 'ร' ? 1 : 0;
      });

      return [...map.values()].map((student) => ({
        ...student,
        subjects: [...student.subjects].sort((a, b) => a.id - b.id),
        overallStatus: getStudentOverallStatus(student),
        priority: getStudentPriority(student)
      }));
    }

    function statusBadgeClass(status) {
      switch (status) {
        case 'ดำเนินการครบแล้ว':
          return 'border-emerald-200 bg-emerald-50 text-emerald-700';
        case 'ต้องติดตาม':
          return 'border-amber-200 bg-amber-50 text-amber-700';
        default:
          return 'border-sky-200 bg-sky-50 text-sky-700';
      }
    }

    function priorityBadgeClass(tone) {
      switch (tone) {
        case 'red':
          return 'border-rose-200 bg-rose-50 text-rose-700';
        case 'amber':
          return 'border-amber-200 bg-amber-50 text-amber-700';
        default:
          return 'border-emerald-200 bg-emerald-50 text-emerald-700';
      }
    }

        { title: 'รอสอบซ่อม', value: student.waitingCount, hint: 'รายการที่ยังรอการสอบซ่อม' },
        { title: 'สอบซ่อมแล้ว', value: student.completedCount, hint: 'รายการที่ดำเนินการครบแล้ว' },
        { title: 'ติดตามงาน', value: student.followUpCount, hint: 'รายการที่ต้องติดตามต่อ' }
      ];

      els.summaryCards.innerHTML = cards.map((card) => `
        <article class="rounded-[1.75rem] border border-line bg-white p-5 shadow-sm">
          <p class="text-xs font-semibold uppercase tracking-[0.18em] text-muted">${card.title}</p>
          <p class="mt-3 text-3xl font-semibold text-ink">${card.value}</p>
          <p class="mt-2 text-sm leading-6 text-muted">${card.hint}</p>
        </article>
      `).join('');
    }

    function renderTable(student) {

          <td class="px-5 py-6 align-top">
            <div class="text-[1.45vh] font-semibold leading-6 text-ink">${escapeHTML(row.subjectCode)} ${escapeHTML(row.subjectName)}</div>
            <div class="mt-1 text-xs text-muted">${escapeHTML(row.teacher || '-')}</div>
          </td>
          <td class="px-5 py-6 text-center align-top">${escapeHTML(row.year)}</td>
          <td class="px-5 py-6 text-center align-top">${escapeHTML(row.term)}</td>
          <td class="px-5 py-6 text-center align-top">${escapeHTML(row.category)}</td>
          <td class="px-5 py-6 text-center align-top">
            <span class="inline-flex rounded-full ${row.score === '0' ? 'bg-rose-50 text-rose-700' : row.score === 'ร' ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-700'} px-3 py-1.5 text-xs font-semibold">${escapeHTML(row.score)}</span>
          </td>
          <td class="px-5 py-6 text-center align-top">
            <span class="inline-flex rounded-full border border-line px-3 py-1.5 text-xs font-semibold ${row.status === 'รอสอบซ่อม' ? 'border-sky-200 bg-sky-50 text-sky-700' : row.status === 'สอบซ่อมแล้ว' ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-amber-200 bg-amber-50 text-amber-700'}">${escapeHTML(row.status)}</span>
          </td>
          <td class="px-5 py-6 align-top text-slate-700">${escapeHTML(row.remark || '-')}</td>
        </tr>
      `).join('');
    }

      els.sidebarOverlay.classList.remove('hidden');
    }

    function closeSidebar() {
      els.sidebar.classList.add('-translate-x-full');
      els.sidebarOverlay.classList.add('hidden');
    }

    function boot() {
      buildBackLink();
      els.mobileMenuButton?.addEventListener('click', openSidebar);
      els.sidebarOverlay?.addEventListener('click', closeSidebar);

      if (!studentId) {
        els.contextLine.textContent = 'ไม่พบรหัสนักเรียนใน URL กรุณากลับไปหน้ารวม';
        els.studentName.textContent = 'ไม่พบข้อมูล';
        els.summaryCards.innerHTML = '';
        els.tableBody.innerHTML = `
          <tr><td colspan="7" class="px-6 py-12 text-center text-sm text-muted">ไม่พบข้อมูลนักเรียน</td></tr>
        `;
        return;
      }

      const matching = records.filter((row) => row.studentId === studentId);
      if (!matching.length) {
        els.contextLine.textContent = `ไม่พบข้อมูลของนักเรียนรหัส ${studentId}`;
        els.studentName.textContent = 'ไม่พบข้อมูล';
        els.tableBody.innerHTML = `
          <tr><td colspan="7" class="px-6 py-12 text-center text-sm text-muted">ไม่พบข้อมูลนักเรียน</td></tr>
        `;
        return;
      }

      const grouped = groupRecordsByStudent(matching);
      const student = grouped[0];

      const contextYear = params.get('year') || student.subjects[0].year;
      const contextTerm = params.get('term') || student.subjects[0].term;
      const contextGrade = params.get('gradeLevel') || student.gradeLevel;
      const contextClass = params.get('classRoom') || student.classRoom;

      els.contextLine.textContent = `เปิดจากบริบท ปีการศึกษา ${contextYear} ภาคเรียน ${contextTerm} ${contextGrade} ${contextClass}`;
      els.studentName.textContent = student.name;
      els.studentId.textContent = `รหัสนักเรียน ${student.studentId}`;
      els.studentClass.textContent = `ห้อง ${student.classRoom}`;
      els.studentGrade.textContent = `ระดับชั้น ${student.gradeLevel}`;
      els.overallBadge.textContent = student.overallStatus;
      els.overallBadge.className = `inline-flex rounded-full border px-3 py-1.5 text-xs font-semibold ${statusBadgeClass(student.overallStatus)}`;
      els.priorityBadge.textContent = student.priority.label;
      els.priorityBadge.className = `inline-flex rounded-full border px-3 py-1.5 text-xs font-semibold ${priorityBadgeClass(student.priority.tone)}`;

      renderSummaryCards(student);
      renderTable(student);
      els.recordCount.textContent = student.subjects.length;
    }

    boot();
  </script>
  </div>
</body>
</html>
