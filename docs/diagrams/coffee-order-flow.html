<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งกาแฟออนไลน์ · Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --rule: rgba(45,49,66,0.12);
      --sans: 'Geist', 'Noto Sans Thai', Tahoma, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif Thai', Georgia, serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 1200px; margin: 0 auto; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 24px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.15;
    }
    .diagram-wrap { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 900px; }
    @media (max-width: 720px) {
      body { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>สั่งกาแฟออนไลน์</h1>

    <div class="diagram-wrap">
      <svg viewBox="0 0 1000 748" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="coffee-order-flow-title coffee-order-flow-desc">
        <title id="coffee-order-flow-title">สั่งกาแฟออนไลน์</title>
        <desc id="coffee-order-flow-desc">Flowchart แสดงขั้นตอนเลือกเมนู ตรวจสอบสินค้า ชำระเงิน และรับกาแฟ โดยมีทางเลือกเมื่อเมนูไม่พร้อม</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors: drawn first so nodes sit cleanly above them. -->
        <path d="M500 88 V120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M500 176 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M500 264 V320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M500 424 V476" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M500 532 V592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M604 372 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Branch labels: masks preserve a visible gap around the connector. -->
        <rect x="508" y="436" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="445" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="648" y="352" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="662" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start -->
        <ellipse cx="500" cy="64" rx="80" ry="24" fill="#f5f5f5"/>
        <ellipse cx="500" cy="64" rx="80" ry="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="500" y="61" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif" text-anchor="middle">เริ่มสั่งกาแฟ</text>
        <text x="500" y="77" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">START</text>

        <!-- Step 1 -->
        <rect x="420" y="120" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="120" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif" text-anchor="middle">เลือกเมนู</text>
        <text x="500" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CHOOSE ITEM</text>

        <!-- Step 2 -->
        <rect x="420" y="208" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="208" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif" text-anchor="middle">ตรวจสอบเมนู</text>
        <text x="500" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CHECK STOCK</text>

        <!-- Decision -->
        <polygon points="500,320 604,372 500,424 396,372" fill="#f5f5f5"/>
        <polygon points="500,320 604,372 500,424 396,372" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif" text-anchor="middle">เมนูพร้อมไหม?</text>
        <text x="500" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AVAILABLE?</text>

        <!-- No branch -->
        <ellipse cx="800" cy="372" rx="80" ry="24" fill="#f5f5f5"/>
        <ellipse cx="800" cy="372" rx="80" ry="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="800" y="369" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif" text-anchor="middle">เลือกเมนูใหม่</text>
        <text x="800" y="385" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TRY AGAIN</text>

        <!-- Yes branch -->
        <rect x="420" y="476" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="476" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif" text-anchor="middle">ชำระเงิน</text>
        <text x="500" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PAYMENT</text>

        <!-- Happy-path end -->
        <ellipse cx="500" cy="616" rx="80" ry="24" fill="#f5f5f5"/>
        <ellipse cx="500" cy="616" rx="80" ry="24" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="500" y="613" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif" text-anchor="middle">รับกาแฟ</text>
        <text x="500" y="629" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DONE</text>

        <!-- Legend -->
        <line x1="40" y1="668" x2="960" y2="668" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <ellipse cx="52" cy="716" rx="12" ry="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="76" y="720" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif">เริ่ม / จบ</text>

        <rect x="240" y="710" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="720" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif">ขั้นตอน</text>

        <polygon points="436,704 452,712 436,720 420,712" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="468" y="720" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif">จุดตัดสินใจ</text>

        <line x1="680" y1="716" x2="708" y2="716" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="724" y="720" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans Thai', Tahoma, sans-serif">เส้นทางหลัก</text>
      </svg>
    </div>
  </main>
</body>
</html>
