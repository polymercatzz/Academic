  <style>*, *::before, *::after { box-sizing: border-box; }
    :root { --bg:#f7f8fa; --surface:#ffffff; --surface-muted:#f3f5f8; --border:#d9dee7; --text:#182230; --muted:#667085; --primary:#173b6d; --primary-soft:#eef3f8; --link:#2f6fba; --font-sans:"Prompt","Noto Sans Thai","Segoe UI",sans-serif; --font-mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",monospace; }

    .frame { width:min(1280px,100%); margin:0 auto; }
    .eyebrow { margin:0 0 8px; color:var(--primary); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0 0 24px; color:var(--text); font-size:clamp(24px,3vw,32px); font-weight:600; line-height:1.2; }
    .diagram-shell { width:100%; overflow-x:auto; border:1px solid var(--border); border-radius:6px; background:var(--surface); }
    svg { display:block; width:100%; min-width:960px; height:auto; }
    .svg-sans { font-family:"Prompt","Noto Sans Thai","Segoe UI",sans-serif; }
    .svg-mono { font-family:ui-monospace,"Cascadia Mono","Segoe UI Mono",monospace; }</style>
