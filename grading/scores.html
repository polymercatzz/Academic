<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบบันทึกคะแนน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      // the report modules ship their own base styles; Tailwind's reset would override them
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            canvas: '#F7F9FC',
            brand: '#2563eb',
            ink: '#0f172a',
            muted: '#64748b'
          },
          fontFamily: {
            body: ['"Noto Sans Thai"', 'system-ui', 'sans-serif']
          },
          fontSize: {
            xs: ['1.15vh', { lineHeight: '1.55' }],
            sm: ['1.35vh', { lineHeight: '1.6' }],
            base: ['1.55vh', { lineHeight: '1.6' }],
            lg: ['1.75vh', { lineHeight: '1.45' }],
            xl: ['2vh', { lineHeight: '1.35' }],
            '2xl': ['2.45vh', { lineHeight: '1.25' }],
            '3xl': ['3vh', { lineHeight: '1.18' }],
            '4xl': ['3.6vh', { lineHeight: '1.12' }],
            '5xl': ['4.2vh', { lineHeight: '1.08' }]
          },
          boxShadow: {
            soft: '0 12px 32px rgba(15, 23, 42, 0.06)'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/type-scale.css?v=1" />
  <link rel="stylesheet" href="../shared/layout-compat.css?v=2" />
  <link rel="stylesheet" href="assets/css/theme.css?v=3" />
</head>
<body class="ar-themed relative min-h-screen overflow-x-hidden bg-canvas font-body text-ink" data-grading-app="scores">
  <!-- ไอคอน (inline SVG sprite) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3zm0 6v5m0 3v.5"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><path d="M4 19h16M6 15V9m4 6V5m4 10v-4m4 4V7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM8 3v5h7V3M8 21v-7h8v7"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 4v6h6M4.5 15a8 8 0 1 0 1.5-8.5L4 10"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-9.5V8"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
  </svg>

  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -left-24 top-0 h-72 w-72 rounded-full bg-blue-200/40 blur-3xl"></div>
    <div class="absolute right-0 top-20 h-80 w-80 rounded-full bg-sky-100/60 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/3 h-80 w-80 rounded-full bg-emerald-100/50 blur-3xl"></div>
  </div>
  <div id="layoutSidebar"></div>

  <div class="relative lg:pl-80">
    <div id="layoutHeader"></div>
    <script src="../shared/academic-layout.js?v=9"></script>
    <script src="grading-layout.js?v=4"></script>
    <!-- stand-ins for the app's own sidebar/topbar: its scripts still write here (see grading-layout.js) -->
    <div hidden aria-hidden="true">
      <nav id="nav"></nav><span id="schoolName"></span><button id="resetDemo"></button><button id="menuBtn"></button><div id="scrim"></div>
      <div id="topbarTitle"></div>
      <div id="roleSwitch"><button data-role="teacher"></button><button data-role="academic"></button></div>
      <span id="userName"></span><span id="userRole"></span><span id="avatar"></span>
    </div>
    <main class="view" id="view"></main>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toasts" id="toasts"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/attendance-core.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/academic.js"></script>
</body>
</html>
